<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyecto Semillero — Videos Interactivos (ORCID · CvLAC · Google Scholar)</title>
  <link rel="stylesheet" href="styles.css?v=2" />
</head>

<body>
  <div class="app-shell">
    <!-- Barra lateral de navegación -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-badge">Semillero</span>
          <h1>Ruta Académica</h1>
          <p class="brand-sub">ORCID · CvLAC · Google Scholar</p>
        </div>
        <button class="sidebar-toggle" id="sidebar-toggle" title="Mostrar / Ocultar menú" aria-expanded="true">▾</button>
      </div>

      <div class="sidebar-content" id="sidebar-content">

      <div class="progress-card">
        <div class="progress-header">
          <span>Tu progreso</span>
          <strong id="global-progress-text">0 / 18</strong>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="global-progress-fill" style="width: 0%"></div>
        </div>
      </div>

      <div class="module-tabs" role="tablist">
        <button class="module-tab active" data-module="orcid">ORCID</button>
        <button class="module-tab" data-module="cvlac">CvLAC</button>
        <button class="module-tab" data-module="scholar">Scholar</button>
      </div>

      <nav class="lesson-list" id="lesson-list" aria-label="Lista de lecciones"></nav>
      </div>
    </aside>

    <!-- Área principal del reproductor interactivo -->
    <main class="stage-area">
      <header class="stage-header">
        <div>
          <span class="module-pill" id="module-pill">ORCID</span>
          <h2 id="lesson-title">Cargando...</h2>
        </div>
        <div class="lesson-meta">
          <span id="lesson-duration">⏱ 4 min</span>
          <span id="lesson-status" class="status-badge">Pendiente</span>
        </div>
      </header>

      <!-- Pantalla tipo video interactivo -->
      <section class="player-frame" id="player-frame">
        <div class="player-screen" id="player-screen">
          <!-- Contenido dinámico de la escena o quiz -->
        </div>

        <!-- Barra de progreso de escenas -->
        <div class="scene-timeline" id="scene-timeline"></div>

        <!-- Controles tipo reproductor -->
        <div class="player-controls">
          <div class="controls-left">
            <button class="btn btn-secondary" id="btn-prev" title="Escena anterior">⏮ Anterior</button>
            <button class="btn btn-primary" id="btn-play" title="Reproducir / Pausar">▶ Reproducir</button>
            <button class="btn btn-secondary" id="btn-next" title="Siguiente escena">Siguiente ⏭</button>
          </div>
          <div class="controls-right">
            <span class="scene-counter" id="scene-counter">Escena 1 / 3</span>
          </div>
        </div>
      </section>

      <!-- Reto práctico al final de la lección -->
      <section class="action-card" id="action-card">
        <h3>🎯 Reto práctico</h3>
        <p id="lesson-challenge"></p>
      </section>
    </main>
  </div>

  <!-- Modal para ampliar imagen de referencia -->
  <div id="image-modal" class="image-modal" aria-hidden="true">
    <button id="modal-close" class="modal-close" title="Cerrar (Esc)">✕</button>
    <img id="modal-img" src="" alt="Imagen ampliada" />
  </div>

  <script src="data.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>

</html>
