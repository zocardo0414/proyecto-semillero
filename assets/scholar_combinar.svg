<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="900" height="500" fill="#ffffff"/>
  <rect width="900" height="56" fill="#f1f3f4"/>
  <line x1="0" y1="56" x2="900" y2="56" stroke="#dadce0"/>
  <text x="28" y="36" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a73e8">Google Académico · Limpieza del Perfil</text>

  <!-- Barra de acciones al seleccionar artículos -->
  <rect x="40" y="84" width="820" height="48" rx="4" fill="#e8f0fe" stroke="#1a73e8"/>
  <rect x="64" y="94" width="110" height="28" rx="4" fill="#1a73e8"/>
  <text x="119" y="113" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">COMBINAR</text>
  <rect x="188" y="94" width="100" height="28" rx="4" fill="#ffffff" stroke="#dadce0"/>
  <text x="238" y="113" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3c4043" text-anchor="middle">ELIMINAR</text>
  <text x="310" y="113" font-family="Arial, sans-serif" font-size="12" fill="#1a73e8">2 artículos seleccionados para fusionar</text>

  <!-- Artículo 1 seleccionado -->
  <rect x="40" y="150" width="820" height="84" rx="4" fill="#f8f9fa" stroke="#1a73e8"/>
  <rect x="62" y="182" width="18" height="18" rx="3" fill="#1a73e8"/>
  <text x="71" y="196" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="98" y="182" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a0dab">Visibilidad científica con ORCID y CvLAC (Versión Revista)</text>
  <text x="98" y="204" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">M. Gómez · Revista Académica · 2024 · 7 citas</text>

  <!-- Artículo 2 seleccionado (duplicado) -->
  <rect x="40" y="250" width="820" height="84" rx="4" fill="#f8f9fa" stroke="#1a73e8"/>
  <rect x="62" y="282" width="18" height="18" rx="3" fill="#1a73e8"/>
  <text x="71" y="296" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="98" y="282" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a0dab">Visibilidad científica con ORCID y CvLAC (Preprint Repositorio)</text>
  <text x="98" y="304" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">M. Gómez · Repositorio Institucional · 2024 · 2 citas</text>

  <rect x="40" y="360" width="820" height="54" rx="4" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="64" y="392" font-family="Arial, sans-serif" font-size="13" fill="#166534">💡 Al hacer clic en COMBINAR, ambos registros se unifican y tus citas se suman (7 + 2 = 9 citas).</text>
</svg>
